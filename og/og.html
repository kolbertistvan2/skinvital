<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Georama:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#EEFBFA 100%);font-family:'Georama',sans-serif;color:#3E4546;position:relative}
.l{position:absolute;left:72px;top:64px;width:600px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:72px}
.brand span{font-size:26px;line-height:1.2;color:#1C7A7D;font-weight:500}
h1{margin:0;font-family:'Bodoni Moda',serif;font-weight:500;font-size:62px;line-height:1.05;color:#0F4B4E;letter-spacing:-0.01em}
p{margin:0;font-size:26px;line-height:1.4}
.pill{align-self:flex-start;background:#1C7A7D;color:#fff;font-weight:600;font-size:24px;padding:14px 28px;border-radius:999px}
.legs{position:absolute;right:-60px;bottom:-10px;width:660px;filter:drop-shadow(0 24px 30px rgba(15,75,78,.18))}
</style></head>
<body>
<div class="l">
<div class="brand"><img src="../public/img/logo.png" alt=""><span>Lézer Stúdió<br>és Kozmetika</span></div>
<h1>Végleges szőrtelenítés Elysion Pro diódalézerrel</h1>
<p>Kizárólag hölgyeknek, Budapest, Kispest</p>
<span class="pill">Ingyenes konzultáció</span>
</div>
<img class="legs" src="../public/img/hero-labak.webp" alt="">
</body></html>
